name: UI tests (quarantine)

# Disabled to save GitHub Actions minutes. Kept for a later re-enable.
# Manual only; do not add pull_request/push until minutes are available.
on:
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: ControlPlaneUITests (non-blocking)
    # GitHub has no macos-16 label; Tahoe images are macos-26 (Xcode 26.x).
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Debug build
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          mkdir -p "$DERIVED_DATA_PATH"
          xcodebuild \
            -project ControlPlane.xcodeproj \
            -scheme ControlPlane \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            build

      - name: UI tests (ControlPlaneUITests)
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project ControlPlane.xcodeproj \
            -scheme ControlPlane \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- \
            test \
            -only-testing:ControlPlaneUITests
